name: Hybrid Android Lab
on:
  push:
    branches: [codex/android-hybrid-lab]
    paths: ['android-hybrid-lab/**', '.github/workflows/hybrid-lab.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages if missing
        shell: bash
        run: |
          sdkmanager="$(find "${ANDROID_HOME:?}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          test -x "$sdkmanager"
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify APK
        run: bash android-hybrid-lab/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-lab-debug
          path: android-hybrid-lab/build/hybrid-lab-debug.apk
          if-no-files-found: error
      - name: Test local APK generation and updates on Android
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager="$(find "${ANDROID_HOME:?}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          export PATH="$(dirname "$sdkmanager"):$ANDROID_HOME/platform-tools:$PATH"
          image='system-images;android-35;google_apis;x86_64'
          "$sdkmanager" "$image" || "$sdkmanager" "$image"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --name hybrid-lab --package "$image" --path "$ANDROID_AVD_HOME/hybrid-lab.avd"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd hybrid-lab -no-window -no-audio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1 -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          trap 'if [ "$?" -ne 0 ]; then tail -n 50 "$RUNNER_TEMP/emulator.log"; fi; kill "$emulator" 2>/dev/null || true' EXIT
          timeout 180 adb wait-for-device
          for attempt in {1..45}; do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 4
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          LAB_INSTRUMENTATION=1 BUILD_DIR="$RUNNER_TEMP/factory-test" bash android-hybrid-lab/build.sh
          adb install "$RUNNER_TEMP/factory-test/hybrid-lab-debug.apk"
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          id=dev.salloum.p0123456789abcdef0123
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for version in 1 2; do
            adb shell am instrument -w -e factory "$version" dev.hybridlab/.LabSmoke | tee "$RUNNER_TEMP/factory-$version.txt"
            grep -q 'FACTORY_OK' "$RUNNER_TEMP/factory-$version.txt"
            adb exec-out run-as dev.hybridlab cat "files/exports/$id.apk" > "$RUNNER_TEMP/generated-$version.apk"
            "$signer" verify "$RUNNER_TEMP/generated-$version.apk"
            adb install -r "$RUNNER_TEMP/generated-$version.apk"
            if [[ "$version" == 1 ]]; then
              "$aapt" dump badging "$RUNNER_TEMP/generated-$version.apk" | grep -F "application-label:'سلوم التجريبي'"
              adb shell run-as "$id" sh -c "'echo retained > files-marker'"
            else
              "$aapt" dump badging "$RUNNER_TEMP/generated-$version.apk" | grep -F "application-label:'سلوم المحدّث'"
              adb shell run-as "$id" cat files-marker | grep -F retained
            fi
          done
          python3 - "$RUNNER_TEMP" <<'PYAPK'
          import hashlib, sys, zipfile
          from pathlib import Path
          checksums = []
          for version in (1, 2):
              with zipfile.ZipFile(Path(sys.argv[1]) / f"generated-{version}.apk") as apk:
                  checksums.append(hashlib.sha256(apk.read("res/drawable/salloum_icon.png")).digest())
          assert checksums[0] != checksums[1]
          print("Verified installation, changed launcher label and icon, and retained app data")
          PYAPK
