name: Hybrid Android Lab
on:
  push:
    branches: [codex/android-hybrid-lab]
    paths: ['android-hybrid-lab/**', '.github/workflows/hybrid-lab.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages if missing
        shell: bash
        run: |
          sdkmanager="$(find "${ANDROID_HOME:?}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          test -x "$sdkmanager"
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify APK
        run: bash android-hybrid-lab/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-lab-debug
          path: android-hybrid-lab/build/hybrid-lab-debug.apk
          if-no-files-found: error
      - name: Test public site snapshots in airplane mode
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager="$(find "${ANDROID_HOME:?}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          export PATH="$(dirname "$sdkmanager"):$ANDROID_HOME/platform-tools:$PATH"
          image='system-images;android-35;google_apis;x86_64'
          "$sdkmanager" "$image" || "$sdkmanager" "$image"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --name hybrid-lab --package "$image" --path "$ANDROID_AVD_HOME/hybrid-lab.avd"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd hybrid-lab -no-window -no-audio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1 -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          trap 'if [ "$?" -ne 0 ]; then tail -n 50 "$RUNNER_TEMP/emulator.log"; fi; kill "$emulator" 2>/dev/null || true' EXIT
          timeout 180 adb wait-for-device
          for attempt in {1..45}; do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 4
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          LAB_INSTRUMENTATION=1 BUILD_DIR="$RUNNER_TEMP/factory-test" bash android-hybrid-lab/build.sh
          adb install "$RUNNER_TEMP/factory-test/hybrid-lab-debug.apk"
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb logcat -c
          timeout 420 adb shell am instrument -w -e offline prepare dev.hybridlab/.LabSmoke
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          adb shell svc data disable
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
          adb shell am force-stop dev.hybridlab
          timeout 200 adb shell am instrument -w -e offline verify dev.hybridlab/.LabSmoke
          adb logcat -d -s System.out SalloumOffline
          adb shell cmd connectivity airplane-mode disable
          adb shell svc wifi enable
          adb shell svc data enable
