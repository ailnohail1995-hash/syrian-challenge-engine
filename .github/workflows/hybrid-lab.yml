name: Hybrid Android Lab
on:
  push:
    branches: [codex/android-hybrid-lab]
    paths: ['android-hybrid-lab/**', '.github/workflows/hybrid-lab.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages if missing
        shell: bash
        run: |
          sdkmanager="$(find "${ANDROID_HOME:?}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          test -x "$sdkmanager"
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify APK
        run: bash android-hybrid-lab/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-lab-debug
          path: android-hybrid-lab/build/hybrid-lab-debug.apk
          if-no-files-found: error
