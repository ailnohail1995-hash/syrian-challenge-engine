name: Hybrid Android Lab
on:
  push:
    branches: [codex/android-hybrid-lab]
    paths: ['android-hybrid-lab/**', '.github/workflows/hybrid-lab.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages if missing
        shell: bash
        run: |
          sdkmanager="$(find "${ANDROID_HOME:?}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          test -x "$sdkmanager"
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify APK
        run: bash android-hybrid-lab/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-lab-debug
          path: android-hybrid-lab/build/hybrid-lab-debug.apk
          if-no-files-found: error
      - name: Test the native alarm on an Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager="$(find "${ANDROID_HOME:?}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          export PATH="$(dirname "$sdkmanager"):$ANDROID_HOME/platform-tools:$PATH"
          image='system-images;android-35;google_apis;x86_64'
          "$sdkmanager" "$image"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --name hybrid-lab --package "$image" --path "$ANDROID_AVD_HOME/hybrid-lab.avd"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd hybrid-lab -no-window -no-audio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1 -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          trap 'if [ "$?" -ne 0 ]; then tail -n 50 "$RUNNER_TEMP/emulator.log"; fi; kill "$emulator" 2>/dev/null || true' EXIT
          timeout 180 adb wait-for-device
          for attempt in {1..45}; do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 4
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb install android-hybrid-lab/build/hybrid-lab-debug.apk
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell pm grant dev.hybridlab android.permission.POST_NOTIFICATIONS
          adb shell cmd appops set --uid dev.hybridlab SCHEDULE_EXACT_ALARM allow
          adb shell cmd appops get --uid dev.hybridlab SCHEDULE_EXACT_ALARM
          adb shell am force-stop dev.hybridlab
          adb shell am start -W -n dev.hybridlab/.MainActivity
          adb shell settings put global stay_on_while_plugged_in 0
          timeout 90 adb shell am instrument -w -e mode alarm dev.hybridlab/.LabSmoke | tee "$RUNNER_TEMP/hybrid-smoke.txt"
          adb logcat -d -s HybridTestAlarm AndroidRuntime
          grep -F 'PASS: test alarm started audio with screen off, snooze stopped audio and rescheduled.' "$RUNNER_TEMP/hybrid-smoke.txt"
